<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aprende los departamentos de Colombia con este divertido juego de rompecabezas interactivo">
    <title>Rompecabezas de Departamentos de Colombia</title>

    <!-- PWA Configuration -->
    <link rel="manifest" href="/colombia_department_puzzle/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Theme Color -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#3b82f6">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e40af">

    <!-- Apple-specific Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Colombia Puzzle">
    <link rel="apple-touch-icon" href="/colombia_department_puzzle/icons/icon-192.png">

    <!-- Microsoft-specific Meta Tags -->
    <meta name="msapplication-TileColor" content="#3b82f6">
    <meta name="msapplication-config" content="/colombia_department_puzzle/browserconfig.xml">
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
